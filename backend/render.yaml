# Render Blueprint — deploy from dashboard or: render deploy
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: word-game
    runtime: python
    plan: free

    buildCommand: pip install -r requirements.txt

    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT

    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
